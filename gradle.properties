# ---------------------------------------------------------------------------
# Morsecode — Gradle configuration
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX is mandatory for Compose / Room / Media3.
android.useAndroidX=true

# Keep the resource shrinker and R8 in non-transitive mode: every module only
# sees its own R class, which keeps the core-design icon namespace explicit.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
ksp.incremental=true
ksp.include.compile.classpath=false

# Room schema export location is set per module; keep the KSP arg list explicit.
android.defaults.buildfeatures.buildconfig=true

# Deterministic, reproducible builds: no timestamp-dependent entries in the APK.
android.experimental.enableNewResourceShrinker.preciseShrinking=true
