<!doctype html>
<html lang="en" data-theme="dark" data-accent="sunflower">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morsecode — Material 3 interactive UI mockup</title>
<style>
/* ============================================================
   MORSECODE MATERIAL 3 UI MOCKUP — single file, no network, no build.
   Tokens are the exact values from prompmaster.txt §4.2–4.5.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#FACC15; --acc2:#EAB308; --accInk:#1A1400;
  --ok:#22C55E; --recv:#A78BFA; --recvBg:#412D6D;
  --warn:#F59E0B; --err:#EF4444; --info:#0EA5E9; --lime:#84CC16;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-accent="leaf"]  {--acc:#84CC16;--acc2:#65A30D}
html[data-accent="ember"] {--acc:#EA580C;--acc2:#C2410C}
html[data-accent="violet"]{--acc:#8B5CF6;--acc2:#7C3AED}
html[data-accent="sky"]   {--acc:#0EA5E9;--acc2:#0284C7}
html[data-theme="dark"]{
  --bg:#0B0B0B; --card:#141414; --raised:#1A1A1A; --pressed:#1F1F1F; --line:#1F1F1F;
  --t1:#F5F5F4; --t2:#A1A1AA; --t3:#71717A;
  --bezel:#151515; --bezelLine:#242424; --shadow:none;
  --deskBg:#0E0E0E; --deskPanel:#121212;
  --ph1:40%; --ph2:26%; --phS:38%;
}
html[data-theme="light"]{
  --bg:#EEEDE7; --card:#FFFFFF; --raised:#F5F4EE; --pressed:#E9E8E3; --line:#E4E1D8;
  --t1:#141310; --t2:#6B6862; --t3:#8A867E;
  --bezel:#FFFFFF; --bezelLine:#DDD9CF; --shadow:0 2px 10px rgba(20,19,16,.07);
  --deskBg:#E7E5DE; --deskPanel:#FFFFFF;
  --ph1:80%; --ph2:68%; --phS:70%;
}
body{margin:0;background:var(--deskBg);color:var(--t1);font-family:var(--sans);font-size:14px;
  overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}

/* ---------- workbench chrome ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--deskPanel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.brandmark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#EF7D0F,#F5A712 55%,#FBBF24);
  display:grid;place-items:center}
.brandmark svg{width:16px;height:16px}
.brand small{display:block;font-weight:400;font-size:10px;color:var(--t3);font-family:var(--mono)}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:600}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.dot.on{border-color:var(--t1);outline:2px solid var(--bg)}
.tlabel{font-size:11px;color:var(--t3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.spacer{flex:1}

.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 49px)}
.rail{width:214px;flex:none;position:sticky;top:49px;max-height:calc(100vh - 49px);overflow:auto;
  padding:14px 10px 40px;background:var(--deskPanel);border-right:1px solid var(--line)}
.rail h4{margin:16px 8px 6px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);font-family:var(--mono)}
.rail a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--t2);
  text-decoration:none;cursor:pointer;font-size:13px}
.rail a:hover{background:var(--raised);color:var(--t1)}
.rail a.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--t1);font-weight:600}
.rail a .k{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--t3)}
.work{flex:1;padding:22px;min-width:0}
.worktitle{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.worktitle h2{margin:0;font-size:18px}
.worktitle span{font-family:var(--mono);font-size:11px;color:var(--t3)}
.hint{font-size:12px;color:var(--t3);margin:-6px 0 16px;max-width:760px;line-height:1.5}
.stagewrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.galcell{background:var(--deskPanel);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:hidden;cursor:pointer}
.galcell:hover{border-color:var(--acc)}
.galcell .cap{font-size:12px;font-weight:600;margin-bottom:2px}
.galcell .sub{font-family:var(--mono);font-size:10px;color:var(--t3);margin-bottom:10px}
.galclip{height:300px;overflow:hidden;border-radius:12px;position:relative}
.galscale{transform-origin:top left}

/* ---------- device frames ---------- */
.phone{width:360px;max-width:100%;height:740px;flex:none;border-radius:40px;background:var(--bezel);
  border:1px solid var(--bezelLine);padding:10px;box-shadow:var(--shadow);position:relative}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:32px;overflow:hidden;
  display:flex;flex-direction:column;color:var(--t1)}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:86px;height:17px;background:#0A0A0A;border-radius:12px;z-index:9}
.sb{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px;font-size:11px;
  font-family:var(--mono);color:var(--t2);flex:none}
.sb .r{display:flex;align-items:center;gap:6px}
.batt{border:1px solid var(--t2);border-radius:3px;padding:0 3px;font-size:9px}
.scr{flex:1;overflow:auto;padding:0 16px 16px;scrollbar-width:thin}
.scr::-webkit-scrollbar{width:5px}.scr::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.hd{display:flex;align-items:center;gap:12px;padding:6px 0 14px;flex:none}
.hd h1{margin:0;font-size:20px;font-weight:600;flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--t2);cursor:pointer;border:0;background:transparent}
.iconbtn:hover{background:var(--raised);color:var(--t1)}
.iconbtn svg{width:18px;height:18px}

/* browser window */
.win{width:1080px;max-width:100%;min-width:0;flex:none;border-radius:14px;overflow:hidden;border:1px solid var(--bezelLine);
  background:var(--bg);box-shadow:var(--shadow)}
.winbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bezel);border-bottom:1px solid var(--line)}
.wdots{display:flex;gap:6px}.wdots i{width:10px;height:10px;border-radius:50%;display:block}
.url{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 12px;
  font-family:var(--mono);font-size:11px;color:var(--t2)}
.winbody{display:flex;height:620px;background:var(--bg)}

/* ---------- shared atoms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.wash{background:color-mix(in srgb,var(--acc) 9%,transparent);border:1px solid color-mix(in srgb,var(--acc) 38%,transparent);border-radius:16px}
.sec{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--t2);font-family:var(--mono);
  margin:18px 0 8px;display:flex;align-items:center}
.sec .act{margin-left:auto;color:var(--acc);text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px;cursor:pointer}
.meta{font-family:var(--mono);font-size:11px;color:var(--t3);line-height:1.5}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;
  border-radius:7px;background:var(--raised);color:var(--t2);white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.recv{background:var(--recvBg);color:var(--recv)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.err{background:color-mix(in srgb,var(--err) 18%,transparent);color:var(--err)}
.chip.line{background:transparent;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0B0B0B;flex:none}
.av.lg{width:44px;height:44px;border-radius:14px;font-size:17px}
.bar{height:4px;border-radius:3px;background:var(--pressed);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--lime));transition:width .25s linear}
.bar.done>i{background:var(--ok)}.bar.paused>i{background:var(--warn)}.bar.err>i{background:var(--err)}
/* photo viewer: an edge-to-edge swipe deck, no arrow buttons */
.swipe{position:relative;flex:1;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.swipe.drag{cursor:grabbing}
.swipe .track{display:flex;height:100%;transform:translateX(-100%);will-change:transform}
.swipe .track.anim{transition:transform .22s cubic-bezier(.22,.61,.36,1)}
.swipe .slide{flex:0 0 100%;height:100%;padding:0 6px;box-sizing:border-box}
.swipe .pic{width:100%;height:100%;border-radius:6px;
  background:linear-gradient(160deg,hsl(var(--hh) 45% 46%),hsl(var(--hh2) 45% 26%))}
.swipe .hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);color:#9A9A9A;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:rgba(0,0,0,.45);
  padding:4px 10px;border-radius:999px;pointer-events:none}
.swipe .dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:none}
.swipe .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3)}
.swipe .dots i.on{background:var(--acc);width:14px;border-radius:3px}
/* scrubber: click anywhere on the track or drag the knob to seek */
.scrub{position:relative;padding:7px 0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.scrub .bar{margin:0;overflow:visible}
.scrub .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--acc);
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 26%,transparent);
  opacity:0;transition:opacity .12s;pointer-events:none}
.scrub:hover .knob,.scrub.drag .knob{opacity:1}
.scrub.drag .bar>i,.scrub:hover .bar>i{transition:none}
.scrub.dark .bar{background:rgba(255,255,255,.2)}
.scrub.big .bar{height:5px}
.btn{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--accInk)}
.btn.ghost{background:var(--raised);color:var(--t1);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#06240F}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn.wash{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.link{color:var(--acc);cursor:pointer;font-size:12px}
.tiles{display:flex;gap:8px;margin-top:12px}
.tile{flex:1;background:var(--raised);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:19px;color:var(--acc)}
.tile span{font-family:var(--mono);font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:17px;height:17px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--pressed);position:relative;cursor:pointer;flex:none;border:0}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--t3);transition:.15s}
.sw.on{background:color-mix(in srgb,var(--acc) 35%,transparent)}
.sw.on i{left:21px;background:var(--acc)}
.radar{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;position:relative;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 7%,transparent) 0%,transparent 70%);
  border:1px solid var(--line)}
.radar::before{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid var(--line)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,color-mix(in srgb,var(--acc) 42%,transparent),transparent 28%);
  animation:sweep 2.4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.blip{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.radar .core{position:absolute;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;background:var(--acc);
  display:grid;place-items:center;color:var(--accInk)}
.center{text-align:center}
.mut{color:var(--t2);font-size:12px;line-height:1.5}
.bn{display:flex;border-top:1px solid var(--line);padding:8px 6px 10px;flex:none;background:var(--bg)}
.bn button{flex:1;border:0;background:transparent;color:var(--t3);font:inherit;font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.bn button svg{width:19px;height:19px}
.bn button.on{color:var(--acc)}
.bn button.on .pill{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.bn .pill{padding:3px 14px;border-radius:9px;display:grid;place-items:center}
.ab{display:flex;border-top:1px solid var(--line);flex:none;background:var(--bg)}
.ab button{flex:1;border:0;background:transparent;color:var(--t2);font:inherit;font-size:10px;cursor:pointer;
  padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.ab button svg{width:18px;height:18px}
.ab button.pri{color:var(--acc)}.ab button.pri .pill{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ab button.danger{color:var(--err)}
.ab .pill{padding:4px 16px;border-radius:9px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);padding:10px 16px 16px;max-height:76%;overflow:auto;z-index:20;
  animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sharegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;text-align:center}
.sharegrid button{background:none;border:0;padding:0;color:var(--t1);font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--sans)}
.sharegrid span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px}
.sharegrid button:hover span{outline:2px solid var(--acc);outline-offset:2px}
.lbox{position:absolute;inset:0;z-index:40;background:rgba(6,6,6,.93);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:22px}
.lbox .lhd{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff}
.lbox .big{width:min(62%,520px);aspect-ratio:4/3;border-radius:14px;
  background:linear-gradient(135deg,hsl(var(--hh) 45% 46%),hsl(var(--hh2) 45% 26%));box-shadow:0 30px 70px rgba(0,0,0,.6)}
.lbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.lbox .nav:hover{background:rgba(255,255,255,.22)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--pressed);margin:2px auto 12px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:15;animation:fade .15s}
html[data-theme="light"] .scrim{background:rgba(20,19,16,.38)}
@keyframes fade{from{opacity:0}}
.dlg{position:absolute;inset:0;z-index:25;display:grid;place-items:center;padding:24px}
.dlgcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px 18px;width:100%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.45)}
.dlgcard h3{margin:12px 0 6px;font-size:16px}
.ph{border-radius:10px;aspect-ratio:1;background:linear-gradient(135deg,hsl(var(--hh) 45% var(--ph1)),hsl(var(--hh2) 45% var(--ph2)));position:relative;cursor:pointer}
.ph.sel{outline:2px solid var(--acc);outline-offset:-2px}
.ph .tick{position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:50%;background:var(--ok);
  display:grid;place-items:center;color:#06240F;font-size:11px}
.ph .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--mono);
  font-size:9px;padding:1px 5px;border-radius:5px}
.ph .play{position:absolute;inset:0;margin:auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.42);
  display:grid;place-items:center;color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px;flex:none;width:100%}
.tabs button{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;
  border:0;background:transparent;color:var(--t2);font:inherit;font-size:12.5px;padding:9px 2px 10px;
  cursor:pointer;position:relative}
.tabs button.on{color:var(--acc);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.selbar{position:absolute;left:12px;right:12px;bottom:70px;z-index:12;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--card);color:var(--t1);
  border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;
  transition:.2s;z-index:100;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.segpill{display:flex;background:var(--raised);border-radius:999px;padding:4px;margin-bottom:6px}
.segpill button{flex:1;border:0;background:transparent;color:var(--t2);font:inherit;font-size:13px;padding:9px;border-radius:999px;cursor:pointer}
.segpill button.on{background:var(--acc);color:var(--accInk);font-weight:600}
.acord{border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer}
.acord b{font-size:14px;display:flex;align-items:center;gap:8px}
.acord b span{margin-left:auto;color:var(--t3)}
.logrow{display:grid;grid-template-columns:52px 44px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);
  font-family:var(--mono);font-size:10px;line-height:1.45}
.lvl{font-weight:700}.lvl.INFO{color:var(--info)}.lvl.WARN{color:var(--warn)}.lvl.ERROR{color:var(--err)}
.check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;color:#fff}
/* webshare */
.wrail{width:86px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:12px 8px;
  display:flex;flex-direction:column;gap:4px;align-items:center}
.wrail .it{width:100%;padding:9px 0;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--t2);font-size:9px;cursor:pointer;border:0;background:transparent}
.wrail .it svg{width:18px;height:18px}
.wrail .it.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.wrail .it b{font-family:var(--mono);font-size:8px;font-weight:500;color:var(--t3)}
.wmain{flex:1;min-width:0;overflow:auto;padding:16px}
.whead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.statcards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden;cursor:pointer}
.statcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--err))}
.statcard b{font-size:26px;color:var(--acc);display:block;line-height:1.1}
.statcard span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--t3)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:38px;text-align:center;margin-top:14px;cursor:pointer}
.drop:hover{border-color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--t3);padding:10px 14px;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tbl tr{cursor:pointer}
.rad{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--t3);background:transparent;padding:0;
  cursor:pointer;color:var(--accInk);display:inline-grid;place-items:center;vertical-align:middle}
.rad svg{width:12px;height:12px}
.rad.on{border-color:var(--acc);background:var(--acc);color:var(--accInk)}
.wsel b,.wsel .meta{white-space:nowrap}
.wsel.lift{bottom:92px}
.ck.abs{position:absolute;top:8px;left:8px;z-index:2}
.grid4 .ck.abs{top:-2px;left:2px;width:17px;height:17px}
.grid4 .ck.abs svg{width:11px;height:11px}
.wsel{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:10px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 18px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.wplayer{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:var(--card);border-top:1px solid var(--line)}
.addr{display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);
  border-radius:11px;padding:8px 10px;margin:2px 0 10px;font-family:var(--mono);font-size:11px;cursor:text}
.addr .pth{flex:1;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .pth span{color:var(--t2);cursor:pointer}.addr .pth span:hover{color:var(--acc)}
.addr .pth b{color:var(--t1)}.addr i{color:var(--t3);font-style:normal;padding:0 1px}
.addr button{background:none;border:0;color:var(--t3);cursor:pointer;display:grid;place-items:center;padding:0}
.addr button:hover{color:var(--acc)}.addr svg{width:15px;height:15px}
.crumb{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:12px;margin-bottom:12px}
.crumb span{cursor:pointer;color:var(--t2)}.crumb span:hover{color:var(--acc)}
.crumb i{color:var(--t3);font-style:normal}
.addr{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--raised);
  border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0 6px;
  font-family:var(--mono);font-size:15px;color:var(--acc);cursor:pointer}
.addr:hover{border-color:var(--acc)}
.addr svg{width:15px;height:15px;color:var(--t3)}
.wsplit{display:grid;grid-template-columns:202px 1fr;gap:14px;align-items:start}
.wfolders{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:0}
.wfolders .sec{margin:2px 0 6px;padding:0 8px}
.ffold{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border:0;background:transparent;
  border-radius:9px;color:var(--t2);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.ffold:hover{background:var(--raised);color:var(--t1)}
.ffold.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.ffold svg{width:15px;height:15px}
.ffold .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ffold b{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--t3)}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--t3);background:transparent;padding:0;
  cursor:pointer;display:grid;place-items:center;color:#06240F;flex:none}
.ck:hover{border-color:var(--acc)}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck svg{width:13px;height:13px}
.ck.rnd{border-radius:50%}
.ph .ck{position:absolute;top:6px;left:6px;z-index:2;border-radius:50%;background:rgba(0,0,0,.45);border-color:#fff}
.ph .ck.on{background:var(--ok);border-color:var(--ok)}
.fthumb{width:28px;height:28px;border-radius:8px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--hh) 45% var(--ph1)),hsl(var(--hh2) 45% var(--ph2)))}
.fthumb.vid::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
.ffold{gap:9px}
.volc{display:inline-flex;align-items:center;gap:5px}
.volc .iconbtn{width:30px;height:30px;color:inherit}
.volbar{display:inline-flex;gap:3px;align-items:center;padding:4px 0}
.volbar i{width:6px;height:15px;border-radius:2px;background:var(--pressed);cursor:pointer;display:block}
.volbar i.on{background:var(--acc)}
.volbar i:hover{background:var(--acc);opacity:.75}
.volc .pc{font-family:var(--mono);font-size:10px;color:var(--t3);width:30px}
/* additions */
.btn svg{width:14px;height:14px;vertical-align:-2px}
.btn.sm svg{width:12px;height:12px}
.li .tx .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whead .btn{flex:none}
.galscale .stagewrap{flex-wrap:nowrap}
.win{position:relative}
.whead h2{margin:0;font-size:15px;font-weight:600}
.wgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.wtiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--pressed)}
.stack i{display:block;height:100%}
.ph .cap{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:9px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.85);max-width:88%;overflow:hidden;white-space:nowrap}
.wpad{height:92px}
.wbrand{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 10px;
  border-bottom:1px solid var(--line);margin-bottom:6px}
.wbrand .mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,#EF7D0F,#F5A712 55%,#FBBF24);color:#1A1400;font-size:14px}
.wbrand small{font-family:var(--mono);font-size:8px;color:var(--t3)}
.galcell .galclip{background:var(--bg)}
.dot:focus{outline:none}
kbd{font-family:var(--mono);font-size:10px;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

/* ---------- responsive: the workbench and the frames follow the window ---------- */
@media (max-width:1240px){
  .win{width:100%}
  .winbody{height:min(620px,62vh)}
  .statcards{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1040px){
  .wsplit{grid-template-columns:168px 1fr}
  .wtiles{grid-template-columns:repeat(4,1fr)!important}
  .rail{width:180px}
}
@media (max-width:900px){
  .shell{flex-direction:column;min-height:0;width:100%;min-width:0}
  .rail{position:sticky;top:49px;width:100%;min-width:0;max-width:100%;box-sizing:border-box;
    max-height:none;display:flex;align-items:center;gap:6px;
    overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:8px 10px;
    border-right:0;border-bottom:1px solid var(--line);z-index:40}
  .rail h4{margin:0 4px 0 10px;flex:none}
  .rail a{flex:none;padding:7px 12px}
  .rail a .k{display:none}
  .work{padding:16px 12px;width:100%}
  .stagewrap{gap:16px;justify-content:center}
  .phone{height:min(740px,78vh)}
  .winbody{height:min(620px,58vh)}
  .wsplit{grid-template-columns:1fr}
  .wfolders{display:flex;overflow-x:auto;gap:6px;padding:6px}
  .wfolders .sec,.wfolders .stack,.wfolders .meta{display:none}
  .ffold{flex:0 0 auto;width:auto;min-width:128px}
  .wmain .tbl th:nth-child(5),.wmain .tbl td:nth-child(5){display:none}
  .statcards{grid-template-columns:repeat(2,1fr)}
  .wtiles{grid-template-columns:repeat(3,1fr)!important}
  .hint{max-width:none}
}
@media (max-width:560px){
  .topbar{gap:8px;padding:8px 10px}
  .brand small{display:none}
  .tlabel{display:none}
  .work{padding:12px 8px}
  .worktitle h2{font-size:16px}
  .phone{height:min(700px,74vh);border-radius:34px;padding:8px}
  .screen{border-radius:28px}
  .gal{grid-template-columns:1fr;gap:16px}
  .galcell{grid-column:span 1!important}
  .wtiles{grid-template-columns:repeat(2,1fr)!important}
  .statcards{grid-template-columns:1fr}
  .wsel{left:8px;right:8px;transform:none;width:auto;flex-wrap:wrap;justify-content:center;border-radius:16px}
  .wplayer{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .sheet{max-height:82%}
}
/* the phone's own contents stay fluid at any frame width */
/* grids re-span on the container, so a 320 dp phone, a 412 dp phone and a
   tablet each get a sensible column count without any hard-coded span */
.grid3{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.grid4{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
.phone{container-type:inline-size}


/* ============================================================
   MATERIAL 3 REDESIGN — v2.0
   A semantic override layer. The prototype's behavior and screen
   registry stay intact while every shared atom follows one system.
   ============================================================ */
:root{
  --m3-primary:var(--acc);
  --m3-on-primary:var(--accInk);
  --m3-primary-container:color-mix(in srgb,var(--acc) 20%,var(--card));
  --m3-on-primary-container:var(--t1);
  --m3-surface:var(--bg);
  --m3-surface-container-low:color-mix(in srgb,var(--card) 72%,var(--bg));
  --m3-surface-container:var(--card);
  --m3-surface-container-high:var(--raised);
  --m3-outline:color-mix(in srgb,var(--t2) 42%,transparent);
  --m3-outline-variant:var(--line);
  --m3-error:var(--err);
  --m3-r-xs:8px;--m3-r-sm:12px;--m3-r-md:16px;--m3-r-lg:24px;--m3-r-xl:28px;--m3-r-full:999px;
  --m3-e1:0 1px 2px rgba(0,0,0,.18),0 1px 3px 1px rgba(0,0,0,.08);
  --m3-e2:0 2px 6px 2px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.18);
  --m3-e3:0 6px 18px 4px rgba(0,0,0,.18);
  --m3-motion:cubic-bezier(.2,0,0,1);
}
html[data-accent="violet"]{--accInk:#fff}
html[data-accent="ember"]{--accInk:#fff}
html[data-theme="dark"]{
  --bg:#10100D;--card:#1B1B17;--raised:#26251F;--pressed:#302F28;--line:#33322B;
  --t1:#E8E5DB;--t2:#CAC6BA;--t3:#918F86;--deskBg:#0C0C0A;--deskPanel:#151511;
  --bezel:#090A08;--bezelLine:#2E2E28;
}
html[data-theme="light"]{
  --bg:#FFFBF2;--card:#F7F2E8;--raised:#EEE9DF;--pressed:#E7E1D5;--line:#D9D3C7;
  --t1:#201E18;--t2:#555148;--t3:#777269;--deskBg:#ECE8DF;--deskPanel:#FFFBF2;
  --bezel:#171713;--bezelLine:#30302A;--shadow:var(--m3-e1);
}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
button,a,.ph,.li,.card,.statcard,.ffold,.drop{transition:background-color .18s var(--m3-motion),color .18s var(--m3-motion),border-color .18s var(--m3-motion),box-shadow .18s var(--m3-motion),transform .18s var(--m3-motion)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 52%,transparent);outline-offset:2px}
button:active,.btn:active,.iconbtn:active{transform:scale(.97)}

/* Simulator workbench */
.topbar{min-height:64px;padding:10px 20px;background:color-mix(in srgb,var(--deskPanel) 94%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brandmark{width:36px;height:36px;border-radius:12px;background:var(--acc);box-shadow:var(--m3-e1)}
.brandmark svg{width:20px;height:20px}.brand small{margin-top:2px}
.seg{border:0;background:var(--raised);padding:4px;border-radius:var(--m3-r-full)}
.seg button{min-height:34px;padding:7px 16px}.seg button.on{box-shadow:var(--m3-e1)}
.rail{top:64px;max-height:calc(100vh - 64px);width:228px;padding:18px 12px;background:var(--deskPanel)}
.rail h4{margin:20px 12px 7px;color:var(--t3)}
.rail a{min-height:40px;border-radius:20px;padding:9px 14px}
.rail a.on{background:var(--m3-primary-container);color:var(--m3-on-primary-container)}
.work{padding:28px}.worktitle h2{font-size:22px;font-weight:500}.hint{font-size:13px}
.gal{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.galcell{border:0;border-radius:var(--m3-r-lg);padding:14px;background:var(--deskPanel);box-shadow:var(--m3-e1)}
.galcell:hover{border:0;box-shadow:var(--m3-e3);transform:translateY(-2px)}

/* Device and application surfaces */
.phone{border-radius:46px;padding:9px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.screen{border-radius:38px}.notch{width:76px;height:19px;border-radius:0 0 14px 14px;top:0}
.sb{height:32px;padding:10px 20px 4px;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--t1)}
.scr{padding:0 18px 18px}.hd{min-height:60px;padding:4px 0 10px;gap:8px}
.hd h1{font-size:24px;line-height:32px;font-weight:500;letter-spacing:0}
.hd h1[style*="font-size:17px"]{font-size:22px!important}
.iconbtn{min-width:40px;width:40px;height:40px;border-radius:20px;color:var(--t2);position:relative}
.iconbtn:hover{background:var(--pressed)}.iconbtn svg{width:20px;height:20px}
.iconbtn::after,.bn button::after,.ab button::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none}
.iconbtn:hover::after,.bn button:hover::after,.ab button:hover::after{opacity:.07}

/* Material surfaces and typography */
.card{background:var(--m3-surface-container);border:0;border-radius:var(--m3-r-md);box-shadow:none}
.card:hover{background:var(--m3-surface-container-high)}
.wash{background:var(--m3-primary-container);border:0;border-radius:var(--m3-r-lg)}
.sec{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.035em;color:var(--t2);margin:22px 0 8px;text-transform:none}
.sec .act{font-size:12px;font-weight:600;min-height:28px;display:flex;align-items:center;color:var(--acc)}
.meta{font-family:var(--sans);font-size:11px;letter-spacing:.01em;line-height:1.45}
.mut{font-size:13px;line-height:1.45;color:var(--t2)}
.chip{min-height:24px;display:inline-flex;align-items:center;border-radius:var(--m3-r-sm);padding:4px 9px;font-family:var(--sans);font-weight:700;font-size:9px;letter-spacing:.05em}
.chip.line{border-color:var(--m3-outline);background:transparent}
.av{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}.av.lg{border-radius:50%}
.btn{min-height:44px;border-radius:var(--m3-r-full);padding:11px 20px;box-shadow:none;letter-spacing:.01em}
.btn:hover{box-shadow:var(--m3-e1);filter:brightness(1.03)}
.btn.ghost{background:transparent;border:1px solid var(--m3-outline);color:var(--t1)}
.btn.ghost:hover{background:var(--raised)}
.btn.sm{min-height:36px;border-radius:var(--m3-r-full);padding:7px 14px}
.btn.wash{background:var(--m3-primary-container);border:0;color:var(--acc)}
.link{font-weight:600}.tiles{gap:10px}.tile{border-radius:var(--m3-r-md);padding:12px 7px;background:var(--raised)}
.li{min-height:56px;padding:10px 4px;gap:12px;border-bottom-color:var(--m3-outline-variant);border-radius:0}
.li[data-act]:hover{background:color-mix(in srgb,var(--t1) 5%,transparent)}
.ico{border-radius:12px}.bar{height:5px;background:var(--pressed)}

/* Navigation, tabs and actions */
.bn{height:72px;padding:7px 8px 10px;border-top:0;background:var(--m3-surface-container)}
.bn button{position:relative;font-size:11px;gap:3px;border-radius:16px;min-width:48px;color:var(--t2)}
.bn button svg{width:21px;height:21px}.bn .pill{min-width:64px;padding:4px 18px;border-radius:var(--m3-r-full)}
.bn button.on{font-weight:700;color:var(--t1)}.bn button.on .pill{background:var(--m3-primary-container);color:var(--acc)}
.ab{min-height:68px;padding:4px 5px;border-top:1px solid var(--line);background:var(--m3-surface-container-low)}
.ab button{position:relative;min-height:58px;border-radius:14px;padding:7px 0 5px;font-size:10px}.ab .pill{padding:3px 14px}
.tabs{border:0;background:var(--raised);border-radius:var(--m3-r-full);padding:4px;margin:0 0 16px;gap:2px;overflow-x:auto}
.tabs button{min-width:62px;padding:9px 7px;border-radius:var(--m3-r-full);font-size:11px}
.tabs button.on{background:var(--m3-primary-container);color:var(--t1)}.tabs button.on::after{display:none}
.segpill{background:var(--raised);padding:4px}.segpill button{min-height:40px}.segpill button.on{box-shadow:var(--m3-e1)}
.sw{width:52px;height:32px;border-radius:var(--m3-r-full);border:2px solid var(--m3-outline);background:transparent}
.sw i{top:5px;left:5px;width:18px;height:18px}.sw.on{border-color:var(--acc);background:var(--acc)}
.sw.on i{left:25px;background:var(--accInk);width:22px;height:22px;top:3px}

/* Discovery and content */
.radar{width:156px;height:156px;border:0;background:radial-gradient(circle,var(--m3-primary-container),transparent 70%)}
.radar::before{border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.radar .core{width:44px;height:44px;box-shadow:var(--m3-e2)}
.ph{border-radius:var(--m3-r-sm);overflow:hidden}.ph:hover{transform:scale(1.018)}
.ph .tick,.check{box-shadow:var(--m3-e1)}
.scrub{padding:10px 0}.scrub .bar{height:4px}.scrub .knob{opacity:1;width:14px;height:14px;box-shadow:none}
.volbar i{width:5px;border-radius:3px}.grid3{gap:7px}.grid4{gap:12px}
.addr{min-height:44px;border:0;border-radius:var(--m3-r-sm);background:var(--raised)}
.scr>.addr{justify-content:flex-start;padding:8px 10px;margin:2px 0 12px;font-size:11px;color:var(--t1)}
.wash>.addr{justify-content:center;margin:14px 0 8px;font-size:16px;background:color-mix(in srgb,var(--acc) 12%,var(--raised));color:var(--acc)}
.selbar{bottom:80px;border:0;border-radius:var(--m3-r-lg);padding:8px;background:var(--m3-surface-container-high);box-shadow:var(--m3-e3)}
.sheet{border:0;border-radius:var(--m3-r-xl) var(--m3-r-xl) 0 0;padding:10px 20px 20px;box-shadow:var(--m3-e3)}
.grab{background:var(--m3-outline);width:32px}.dlgcard{border:0;border-radius:var(--m3-r-xl);box-shadow:var(--m3-e3)}
.toast{border:0;border-radius:var(--m3-r-xs);background:var(--t1);color:var(--bg);box-shadow:var(--m3-e3)}

/* WebShare desktop — responsive Material navigation rail */
.win{border:0;border-radius:var(--m3-r-lg);box-shadow:var(--m3-e2)}
.winbar{background:var(--m3-surface-container);border-bottom:0;padding:12px 16px}.url{border:0;border-radius:var(--m3-r-full);padding:8px 14px}
.wrail{width:92px;border-right:0;background:var(--m3-surface-container);padding:14px 8px}
.wrail .it{min-height:52px;border-radius:var(--m3-r-md);font-family:var(--sans);font-size:10px}
.wrail .it.on{background:var(--m3-primary-container);color:var(--t1)}
.wbrand .mark{border-radius:12px;background:var(--acc)}.wmain{padding:20px;background:var(--bg)}
.whead{min-height:72px;border:0;border-radius:var(--m3-r-lg);padding:14px 18px;box-shadow:none;background:var(--m3-surface-container)}

  doc:{i:'doc',c:'#22C55E'},zip:{i:'zip',c:'#EF4444'},apk:{i:'apk',c:'#8B5CF6'}};

const hsh=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h;};
const hue=(s,k)=>((hsh(s)*(k||137))%360);

/* one scrubber for every player: phone music, phone video, WebShare audio+video */
const SEEK={
  music:{get:()=>S.music, dur:()=>S.music.dur},

function scrub(scope,cls){
  const st=SEEK[scope].get(), p=pct(st.pos,SEEK[scope].dur());
  return `<div class="scrub ${cls||''}" data-act="noop" data-scope="${scope}">
    <div class="bar"><i style="width:${p}%"></i></div>
    <span class="knob" style="left:${p}%"></span></div>`;}
function seekTo(scope,f){const st=SEEK[scope].get();
  st.pos=Math.max(0,Math.min(1,f))*SEEK[scope].dur(); paint();}

  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1700);}

/* ---- sorting: one order applied to every media list on the phone ---- */
const SORTKEYS=[['date','Date modified'],['name','Name'],['size','Size'],['type','Type']];
const sortLabel=()=>(SORTKEYS.find(k=>k[0]===S.sort.key)||SORTKEYS[0])[1]
  +' · '+(S.sort.dir==='desc'?(S.sort.key==='name'?'Z → A':S.sort.key==='size'?'largest first':'newest first')
                            :(S.sort.key==='name'?'A → Z':S.sort.key==='size'?'smallest first':'oldest first'));
function sortBy(arr,get){
  const {key,dir}=S.sort;
  return [...arr].sort((a,b)=>{const A=get(a),B=get(b);
    if(A.folder!==B.folder) return A.folder?-1:1;           /* folders always first */
    let r = key==='name'? String(A.name).localeCompare(String(B.name))
          : key==='size'? (A.size||0)-(B.size||0)
          : key==='type'? String(A.type).localeCompare(String(B.type))||String(A.name).localeCompare(String(B.name))
          : (A.date||0)-(B.date||0);
    return dir==='asc'?r:-r;});}
function sortSheet(){
  return `<div class="scrim" data-act="shclose"></div>
  <div class="sheet"><div class="grab"></div>
    <b style="font-size:15px">Sort by</b>

    ${SORTKEYS.map(([k,l])=>`<div class="li" data-act="sortkey" data-v="${k}" style="cursor:pointer">
      <span class="tx"><b style="${S.sort.key===k?'color:var(--acc)':''}">${l}</b></span>

      <button class="btn sm ${S.sort.dir==='desc'?'':'ghost'}" data-act="sortdir" data-v="desc">${svg('down')} Descending</button>
      <button class="btn sm ${S.sort.dir==='asc'?'':'ghost'}" data-act="sortdir" data-v="asc">${svg('up')} Ascending</button>

/* ---- simulated engine tick: advances bytes, promotes queued, never hangs ---- */
function advance(list,dt,key){
  let active=list.find(x=>x.state==='sending'||x.state==='receiving');
  if(!active){
    const nxt=list.find(x=>x.state==='queued');
    if(nxt){nxt.state=key==='rx'?'receiving':'sending';active=nxt;}
  }
  if(!active) return;
  const jit=0.86+Math.random()*0.3;
  active.sent=Math.min(active.size,active.sent+active.speed*dt*jit);
  if(active.sent>=active.size-1){active.sent=active.size;active.state='done';active.speed=0;}
}
function bcastAdvance(dt){
  const b=S.bc; if(b.done) return;
  let all=true;
  b.peers.forEach(pid=>{
    const d=b.d[pid]; if(d.state!=='ok') return;
    const cur=b.items.find(it=>(d.sent[it.id]||0)<it.size);
    if(!cur){return;}
    all=false;
    const jit=0.85+Math.random()*0.32;
    d.sent[cur.id]=Math.min(cur.size,(d.sent[cur.id]||0)+d.speed*dt*jit);
  });
  b.items.forEach(it=>{
    const started=b.peers.some(p=>(b.d[p].sent[it.id]||0)>0);
    const fin=b.peers.every(p=>b.d[p].state!=='ok'||(b.d[p].sent[it.id]||0)>=it.size);
    it.state=fin?'done':started?'sending':'queued';
  });
  if(all) b.done=true;
}
function tick(){
  const dt=0.25;
  if(S.run){
    if(!S.tx.paused) advance(S.tx.items,dt,'tx');
    advance(S.rx.items,dt,'rx'); advance(S.rx.back,dt,'tx');
    bcastAdvance(dt);
    if(!DRAG){                                   /* never fight the user's thumb */
      if(S.music.playing){S.music.pos=(S.music.pos+dt*2)%S.music.dur;}
      if(S.video.playing){S.video.pos=(S.video.pos+dt*2)%S.video.dur;}
      if(S.web.playing){S.web.pos=(S.web.pos+dt*2)%248;}
      if(S.wv.playing){S.wv.pos=(S.wv.pos+dt*2)%S.wv.dur;}
    }
  }
  paint();
}
/* targeted DOM updates so the prototype never re-renders under your finger */
function paint(){
  const root=document.getElementById('live'); if(!root) return;
  root.querySelectorAll('[data-prog]').forEach(el=>{
    const [scope,id]=el.dataset.prog.split(':');
    const list=scope==='tx'?S.tx.items:scope==='rx'?S.rx.items:scope==='back'?S.rx.back:[];
    const it=list.find(x=>x.id===id); if(!it) return;
    const p=pct(it.sent,it.size);
    const fill=el.querySelector('.bar>i'); if(fill) fill.style.width=p+'%';
    const bar=el.querySelector('.bar'); if(bar) bar.className='bar'+(it.state==='done'?' done':it.state==='paused'?' paused':'');
    const meta=el.querySelector('[data-meta]'); if(meta) meta.innerHTML=rowMeta(it);
    const chip=el.querySelector('[data-chip]'); if(chip){const c=chipFor(it);chip.className='chip '+c.cls;chip.textContent=c.txt;}
  });
  root.querySelectorAll('[data-bprog]').forEach(el=>{
    const [iid,pid]=el.dataset.bprog.split(':');
    const it=S.bc.items.find(x=>x.id===iid); const d=S.bc.d[pid]; if(!it||!d) return;
    const p=pct(d.sent[iid]||0,it.size);
    el.querySelector('.bar>i').style.width=p+'%';
    el.querySelector('.bar').className='bar'+(p>=100?' done':'');
    el.querySelector('[data-pc]').textContent=p<=0?'–':Math.round(p)+'%';
  });
  root.querySelectorAll('[data-sum]').forEach(el=>{el.innerHTML=summaryText(el.dataset.sum);});
  root.querySelectorAll('[data-tile]').forEach(el=>{el.textContent=tileVal(el.dataset.tile);});
  const setPos=(el,p)=>{const i=el.querySelector('.bar>i'); if(i) i.style.width=p+'%';
    const k=el.querySelector('.knob'); if(k) k.style.left=p+'%';};
  const mp=root.querySelector('[data-mp]');

    mp.querySelector('[data-el]').textContent=fmtTime(S.music.pos);
    mp.querySelector('[data-re]').textContent='-'+fmtTime(S.music.dur-S.music.pos);}
  const vp=root.querySelector('[data-vp]');

function summaryText(kind){
  if(kind==='tx'){
    const l=S.tx.items,n=s=>l.filter(x=>x.state===s).length;
    const spd=l.filter(x=>x.state==='sending').reduce((a,b)=>a+b.speed,0);
    const allDone=l.every(x=>x.state==='done');
    return allDone
      ? `<b style="color:var(--ok)">✓ Batch complete</b><div class="meta">${l.length} sent · 0 failed · 0 skipped — avg ${fmtSpd(6.2*MB)}</div>`
      : `<b>Batch in progress</b><div class="meta">${n('sending')} sending · ${n('queued')} queued · ${n('paused')} paused — avg ${fmtSpd(spd||6.2*MB)}</div>`;
  }
  if(kind==='rx'){
    const done=S.rx.items.filter(x=>x.state==='done').length+2;
    const spd=S.rx.items[0].state==='done'?8.4*MB:S.rx.items[0].speed;
    return `<b style="color:var(--ok)">✓ Batch complete</b><div class="meta">In: ${done} received · 0 failed · 1 skipped — avg ${fmtSpd(spd)}<br>Out: 2 sent · 0 failed · 0 skipped — avg ${fmtSpd(5.7*MB)}</div>`;
  }
  if(kind==='bc'){
    const b=S.bc,thr=b.peers.reduce((a,p)=>a+(b.d[p].state==='ok'?b.d[p].speed:0),0);
    const n=s=>b.items.filter(x=>x.state===s).length;
    return b.done
      ? `<b style="color:var(--ok)">✓ Batch complete</b><div class="meta">${b.items.length*b.peers.length} deliveries · 0 failed · 0 skipped — avg ${fmtSpd(14.2*MB)}</div>`
      : `<b>⇶ Broadcasting to ${b.peers.length} phones</b><div class="meta">${n('sending')} broadcasting · ${n('queued')} queued — combined throughput ${fmtSpd(thr)}</div>`;
  }
  if(kind==='bcrx'){
    const b=S.bc,d=b.d.r,cur=b.items.find(it=>(d.sent[it.id]||0)<it.size);
    const q=b.items.filter(it=>(d.sent[it.id]||0)<=0).length;
    return `<b>Receiving from ${SELF.name}</b><div class="meta">${cur?1:0} receiving · ${q} queued — avg ${fmtSpd(d.speed)}</div>`;
  }
  return '';
}
function tileVal(k){
  const b=S.bc,batch=b.items.reduce((a,x)=>a+x.size,0);

  return ({peers:String(b.peers.length),batch:Math.round(batch/MB),

const MBof=t=>{const v=parseFloat(t);if(!isFinite(v))return 0;
  return String(t).endsWith('GB')?v*1000:String(t).endsWith('KB')?v/1000:v;};

/* one selection key space: p<n> photos · v<i> videos · m<i> music · d<i> docs
   · a<i> apps · f<i> rows in the file browser. pageKeys() drives every select-all. */
function pageKeys(v){
  if(v==='p') return [...Array(15).keys()].map(i=>'p'+(i+1));
  if(v==='v') return VIDEOS.map((_,i)=>'v'+i);
  if(v==='m') return [...Array(8).keys()].map(i=>'m'+i);

  if(v==='a') return WAPPS.map((_,i)=>'a'+i);

  return [];}

  if(k[0]==='v'&&VIDEOS[i]) return [VIDEOS[i][0],'video',VIDEOS[i][2],false];

  if(k[0]==='f'&&FILEROWS[i]) return [FILEROWS[i][0],FILEROWS[i][1],MBof(FILEROWS[i][2]),FILEROWS[i][1]==='folder'];

    if(stay) restoreScroll(sc);

    S.files.vid=i;S.video.dur=(+d[0])*60+(+d[1]);S.video.pos=Math.round(S.video.dur*0.28);
    S.video.playing=true;go('video');},
  ftab(v){S.files.tab=v;S.screen=({photos:'fPhotos',videos:'fVideos',music:'fMusic',apps:'fApps',files:'fFiles'})[v];render();},
  selph(v){S.files.sel.has(v)?S.files.sel.delete(v):S.files.sel.add(v);render();},
  selgroup(v){const [k,list]=v.split(':');const ids=list.split(',').map(n=>k+n);
    const all=ids.every(i=>S.files.sel.has(i));ids.forEach(i=>all?S.files.sel.delete(i):S.files.sel.add(i));render();},
  clearsel(){S.files.sel.clear();render();},
  sendsel(){const sel=S.files.sel; if(!sel.size) return;
    const n=sel.size, bytes=selBytesOf(sel), peer=PEERS[S.tx.peer];
    const items=[...sel].map((k,j)=>{const [nm,kd,mb,fold]=selItem(k);
      return {id:'q'+j+'_'+hsh(k).toString(36),name:fold?nm+'.zip':nm,kind:fold?'zip':kd,
        size:Math.max(0.3,mb)*MB,sent:0,speed:(3.5+Math.random()*4)*MB,state:'queued'};});
    S.tx.items=S.tx.items.filter(x=>x.state!=='done').concat(items);
    sel.clear();                                   /* selection ends when the send starts */
    go('sending');
    toast('Queued '+n+' items · '+fmtMB(bytes)+' → '+peer.name);},
  sendone(v){const [nm,kd,mb,fold]=selItem(v),peer=PEERS[S.tx.peer];
    S.tx.items=S.tx.items.filter(x=>x.state!=='done').concat([{id:'q_'+hsh(v).toString(36),
      name:fold?nm+'.zip':nm,kind:fold?'zip':kd,size:Math.max(0.3,mb)*MB,sent:0,
      speed:(3.5+Math.random()*4)*MB,state:'queued'}]);
    S.files.sel.delete(v); go('sending');
    toast('Queued '+nm+' · '+fmtMB(mb*MB)+' → '+peer.name);},
  sortopen(v){S.sheet={kind:'sort',base:v||'files'};render();},
  sortkey(v){S.sort.key=v;toast('Sorted by '+sortLabel());render();},
  sortdir(v){S.sort.dir=v;toast('Sorted by '+sortLabel());render();},
  sharesheet(v){
    if(v==='sel'){const n=S.files.sel.size;
      S.sheet={base:'files',title:n+' item'+(n===1?'':'s'),sub:fmtMB(selBytesOf(S.files.sel))};}
    else if(v==='log') S.sheet={base:'logs',title:'morsecode-log.txt',sub:'12.4 KB · Morsecode 1.0.0 (1)'};
    else if(v==='crash') S.sheet={base:'crashes',title:'morsecode-crash-reports.txt',sub:'3 reports · local diagnostic data'};
    else if(v==='viewer') S.sheet={base:'viewer',title:'IMG_2043.jpg',sub:'4.1 MB · image/jpeg'};
    else if(v==='browse'){const n=S.files.sel.size;
      S.sheet={base:'browse',title:n+' item'+(n===1?'':'s'),sub:fmtMB(selBytesOf(S.files.sel))};}
    render();},
  shared(v){const t=S.sheet?S.sheet.title:'';S.sheet=null;render();
    toast(v==='Clipboard'?'Copied to clipboard':'Shared '+t+' → '+v);},
  shclose(){S.sheet=null;render();},
  hist(v){S.hist=v;S.screen=v==='received'?'histR':'histS';render();},
  set(v){S.set[v]=!S.set[v];
    if(v==='follow'&&S.set.follow)toast('Following the system theme');render();},
  cycle(v){ if(v==='conflict'){const o=['Rename duplicates','Overwrite','Skip existing','Ask every time'];

  play(v){ if(v==='music')S.music.playing=!S.music.playing;
    if(v==='video')S.video.playing=!S.video.playing;
    if(v==='web')S.web.playing=!S.web.playing;
    if(v==='wv')S.wv.playing=!S.wv.playing; render();},
  nudge(v){const [scope,d]=v.split(':'),st=SEEK[scope].get(),dur=SEEK[scope].dur();
    st.pos=Math.max(0,Math.min(dur,st.pos+(+d)));
    toast((+d>0?'Forward ':'Back ')+Math.abs(+d)+' s · '+fmtTime(st.pos));paint();},
  faq(v){S.help=(S.help===+v?-1:+v);render();},
  consent(v){ if(v==='accept'){toast('Accepted — session open');go(S.consent==='browser'?'wHome':'receiving');}
    else{toast('Rejected · the sender is told immediately');go('receive');}},
  consentSwap(){S.consent=S.consent==='browser'?'peer':'browser';S.screen=S.consent==='browser'?'consentB':'consentP';render();},
  webtoggle(){S.webOn=!S.webOn;toast(S.webOn?'WebShare running on :33455':'WebShare stopped');render();},
  closeSheet(){go('sending');},
  errOnly(){S.errOnly=!S.errOnly;render();},
  fixbatt(){S.doctor=S.doctor.map(c=>c.k.indexOf('Battery')===0?{k:'Battery optimization off',v:'Morsecode is exempt — transfers survive the screen going off',s:'ok'}:c);
    toast('Exemption granted');render();},
  recheck(){toast('Re-running 6 checks…');render();},
  wnav(v){S.web.page=v;S.screen=({home:'wHome',photos:'wPhotos',videos:'wVideos',music:'wMusic',docs:'wDocs',
    apps:'wApps',files:'wFiles',player:'wPlayer'})[v]||'wHome';render();},
  wsel(v){S.web.sel.has(v)?S.web.sel.delete(v):S.web.sel.add(v);render();},
  wselall(){ S.web.sel.size?S.web.sel.clear():pageKeys('p').forEach(k=>S.web.sel.add(k)); render();},
  wselpage(v){const keys=pageKeys(v),all=allOn(v);
    keys.forEach(k=>all?S.web.sel.delete(k):S.web.sel.add(k));render();},
  wclear(){S.web.sel.clear();render();},
  wlight(v){S.web.light=+v;render();},
  wlightnav(v){const n=S.web.light+(+v);S.web.light=n<1?15:n>15?1:n;render();},
  wlightclose(){S.web.light=null;render();},
  wstop(){S.web.playerOpen=false;S.web.playing=false;toast('Playback stopped · element released');render();},
  wtrack(v){S.web.track=+v;S.web.pos=0;S.web.playing=true;S.web.playerOpen=true;render();},
  wopen(v){S.web.path=S.web.path.concat([v]);toast('Opened /'+S.web.path.join('/'));render();},
  wcrumb(v){S.web.path=S.web.path.slice(0,+v+1);render();},
  wfsel(v){S.web.fsel=S.web.fsel===v?null:v;render();},
  mute(){S.muted=!S.muted;toast(S.muted?'Muted — level remembered':'Unmuted · '+Math.round(S.vol*100)+'%');render();},
  vol(v){S.vol=(+v)/10;S.muted=false;toast('Volume '+Math.round(S.vol*100)+'%');render();},
  walbum(v){S.web.album=v;S.web.sel.clear();render();},
  wvfolder(v){S.web.vfolder=v;render();},
  wquick(v){S.web.quick=v;S.web.fsel=null;
    S.web.path=v==='Internal storage'?['Internal storage']:['Internal storage',v];render();},
  toast(v){toast(v);},
  noop(){}
};
function syncTop(){
  document.querySelectorAll('#accentDots .dot').forEach(d=>d.classList.toggle('on',d.dataset.v===S.accent));
  document.querySelectorAll('.seg button[data-act="theme"]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
}
/* ==========================================================================
   9. INIT
   ========================================================================== */
document.getElementById('accentDots').innerHTML=ACCENTS.map(a=>
  `<button class="dot ${a.id===S.accent?'on':''}" style="background:${a.hex}" data-act="accent" data-v="${a.id}" title="${a.id}"></button>`).join('');
/* scrubbing: press anywhere on a track, drag, release — works for mouse and touch */
let DRAG=null, SW=null;
const frac=(ev,r)=>Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
document.addEventListener('pointerdown',ev=>{
  const sw=ev.target.closest('[data-swipe]');
  if(sw){const tr=sw.querySelector('.track');
    SW={box:sw,tr,x0:ev.clientX,w:sw.getBoundingClientRect().width,dx:0};
    tr.classList.remove('anim'); sw.classList.add('drag'); return;}
  const el=ev.target.closest('.scrub'); if(!el) return;

  el.classList.add('drag'); seekTo(DRAG.scope,frac(ev,DRAG.rect));
});
document.addEventListener('pointermove',ev=>{
  if(SW){ev.preventDefault();SW.dx=ev.clientX-SW.x0;
    SW.tr.style.transform=`translateX(calc(-100% + ${SW.dx}px))`;return;}

/* release: past a quarter of the width the deck commits to the neighbour */
function endSwipe(){ if(!SW) return; const {tr,dx,w,box}=SW; SW=null; box.classList.remove('drag');
  const go_=Math.abs(dx)>Math.max(46,w*0.22)?(dx<0?1:-1):0;
  tr.classList.add('anim');
  tr.style.transform=`translateX(${go_===0?'-100%':go_>0?'-200%':'0%'})`;
  if(!go_) {setTimeout(()=>{tr.style.transform='';tr.classList.remove('anim');},230); return;}

    S.files.photo=go_>0?(n<15?n+1:1):(n>1?n-1:15); render();},200);

/* Files tabs: horizontal touch swipe changes category; vertical movement still scrolls. */
let TAB_SWIPE=null;

  const tabs=['photos','videos','music','apps','files'],i=tabs.indexOf(S.files.tab);

  if(next!==i){ACT.ftab(tabs[next]);toast(tabs[next][0].toUpperCase()+tabs[next].slice(1));}
},{passive:true});

document.documentElement.dataset.theme=S.theme;
document.documentElement.dataset.accent=S.accent;
/* laptops: arrow keys walk the viewer; the phone gesture is a swipe */
document.addEventListener('keydown',ev=>{
  if(S.mode!=='proto') return;
  if(S.screen==='viewer'&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')){
    const n=S.files.photo||3;
    S.files.photo=ev.key==='ArrowRight'?(n<15?n+1:1):(n>1?n-1:15); render();}
  if(S.web.light&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')) ACT.wlightnav(ev.key==='ArrowRight'?1:-1);

});
render();
setInterval(tick,250);
setInterval(()=>{const d=new Date();
  document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');},1000);
