name: Android CI

# The Android toolchain cannot be installed in every checkout of this repository,
# so compilation, KSP/Hilt processing, lint, unit tests and APK assembly are
# proven here instead. The Node scripts under tools/verify check design-token
# fidelity only; they are not a substitute for this workflow.
#
# Failure text is republished as check-run annotations on purpose: the Actions
# log blob hosts are not reachable from every environment, while the annotations
# API is, so a failed run can be diagnosed without downloading logs.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - arena/01a0e98a-morsec

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, lint, assemble (JDK 17 · API 36 · minSdk 23)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; only the packages this project needs
      # are installed explicitly so the build never depends on image drift.
      - name: Install Android SDK Platform 36 and build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            ls -R "$SDK" | head -50
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Record the build environment
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          {
            echo "== date/uname =="; date -u; uname -a
            echo "== java =="; java -version 2>&1; echo "JAVA_HOME=$JAVA_HOME"
            echo "== PATH =="; echo "$PATH" | tr ':' '\n'
            echo "== android =="; echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1 || true
            ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>&1 || true
            echo "== which =="; for c in gradle sdkmanager java javac python3 unzip curl; do printf '%s: ' "$c"; command -v "$c" || echo MISSING; done
            echo "== local.properties =="; cat local.properties 2>&1 || true
          } 2>&1 | tee ci-logs/00-environment.log

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      # gradle/wrapper/gradle-wrapper.jar is a binary artifact and is not in the
      # repository yet, so the wrapper is generated here and uploaded below.
      - name: Generate the Gradle wrapper
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          {
            if ! command -v gradle > /dev/null 2>&1; then
              echo "gradle is not on PATH; installing the 8.13 distribution directly"
              curl -fsSL -o /tmp/gradle-8.13-bin.zip \
                https://services.gradle.org/distributions/gradle-8.13-bin.zip
              unzip -q /tmp/gradle-8.13-bin.zip -d /opt
              export PATH="/opt/gradle-8.13/bin:$PATH"
              echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"
            fi
            echo "gradle: $(command -v gradle)"
            gradle --version
            gradle wrapper --gradle-version 8.13 --distribution-type bin
            chmod +x gradlew
            test -s gradle/wrapper/gradle-wrapper.jar || echo "::error::wrapper jar was not generated"
            test -s gradlew.bat || echo "::error::gradlew.bat was not generated"
            ls -la gradlew gradlew.bat gradle/wrapper/
            ./gradlew --version
          } 2>&1 | tee ci-logs/05-wrapper.log

      - name: Milestone hygiene (no TODO/stub markers in delivered sources)
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace checkMilestoneHygiene 2>&1 | tee ci-logs/10-hygiene.log

      - name: JVM unit tests
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --continue test 2>&1 | tee ci-logs/20-unit-tests.log

      - name: Android lint
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --continue \
            :app:lintDebug \
            :core-design:lintDebug \
            :core-data:lintDebug \
            :core-storage:lintDebug \
            :transport-lan:lintDebug \
            :transport-nearby:lintDebug \
            :media:lintDebug 2>&1 | tee ci-logs/30-lint.log

      - name: Assemble the debug APK
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ci-logs/40-assemble.log

      - name: Summarise test and lint results
        if: always()
        env:
          SUMMARY_PATH: ${{ github.step_summary }}
        run: |
          python3 - <<'PY'
          import os, glob, xml.etree.ElementTree as ET

          lines = ["## Test results", ""]
          total = failed = skipped = 0
          files = sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True))
          for path in files:
              module = path.split("/build/")[0]
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  lines.append(f"- `{module}` — {os.path.basename(path)}: unparseable report")
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  t = int(suite.get("tests", 0))
                  f = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s = int(suite.get("skipped", 0))
                  total += t; failed += f; skipped += s
                  lines.append(f"- `{module}` — {suite.get('name', '?')}: {t} tests, {f} failed, {s} skipped")
          if not files:
              lines.append("No unit-test reports were produced.")
          lines += ["", f"**Total: {total} tests, {failed} failed, {skipped} skipped**", "", "## Lint", ""]
          reports = sorted(set(glob.glob("**/build/reports/lint-results-debug.*", recursive=True)))
          lint_issues = 0
          for path in reports:
              if path.endswith(".xml"):
                  try:
                      issues = ET.parse(path).getroot().findall("issue")
                      lint_issues += len(issues)
                      lines.append(f"- `{path.split('/build/')[0]}`: {len(issues)} issue(s)")
                  except ET.ParseError:
                      lines.append(f"- `{path}`: unparseable report")
              else:
                  lines.append(f"- `{path}`")
          if not reports:
              lines.append("No lint reports were produced.")
          else:
              lines += ["", f"**Total lint issues: {lint_issues}**"]
          apks = sorted(glob.glob("app/build/outputs/apk/debug/*.apk"))
          lines += ["", "## APK", ""]
          lines += [f"- `{a}`: {os.path.getsize(a) / 1048576:.2f} MiB" for a in apks] or ["No APK produced."]

          with open(os.environ["SUMMARY_PATH"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      # Publishes the interesting lines of every captured Gradle log as check-run
      # annotations, which stay readable through the REST API.
      - name: Publish failure annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re

          ERROR_LINE = re.compile(
              r"(^e: |^w: |error:|ERROR:|AAPT: error|FAILURE:|What went wrong|"
              r"^> Task .* FAILED|Execution failed for task|Caused by:|"
              r"Lint found|errors? generated|unresolved reference|"
              r"Kotlin could not compile|Could not resolve|Cannot access built-in|"
              r"java\.lang\.|GradleException|warning: )", re.IGNORECASE)
          MAX_ANNOTATIONS = 140
          MAX_MESSAGE = 600

          def command(level, title, message):
              # Workflow-command escaping: %, \r and \n are special in ::commands::.
              text = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              title = title.replace("%", "%25").replace("\r", " ").replace("\n", " ")
              return f"::{level} title={title}::{text}"

          emitted = 0
          logs = sorted(glob.glob("ci-logs/*.log"))
          if not logs:
              print("::error title=ci::no Gradle logs were captured")  # noqa

          for path in logs:
              name = os.path.basename(path)
              with open(path, encoding="utf-8", errors="replace") as handle:
                  lines = handle.read().splitlines()
              failures = [i for i, l in enumerate(lines) if l.startswith("FAILURE:")]
              if failures:
                  start = failures[0]
                  block = [l for l in lines[start:start + 60] if l.strip()]
                  message = " ⏎ ".join(block)[:4000]
                  print(command("error", f"{name} — build failure", message))
                  emitted += 1
              matches = []
              seen = set()
              for i, line in enumerate(lines):
                  stripped = line.strip()
                  if not stripped or not ERROR_LINE.search(stripped):
                      continue
                  if stripped.startswith("w: ") and len(matches) > 40:
                      continue  # warnings only matter once the errors are fixed
                  key = stripped[:200]
                  if key in seen:
                      continue
                  seen.add(key)
                  matches.append(f"L{i + 1}: {stripped[:MAX_MESSAGE]}")
              for entry in matches[:60]:
                  if emitted >= MAX_ANNOTATIONS:
                      break
                  print(command("error", name, entry))
                  emitted += 1
              # Always publish the tail: when a step dies before Gradle starts
              # (missing binary, bad PATH) there are no error lines to match.
              tail = [l for l in lines[-25:] if l.strip()]
              if tail and emitted < MAX_ANNOTATIONS:
                  print(command("error", f"{name} — tail", " ⏎ ".join(tail)[:3000]))
                  emitted += 1
              print(f"{name}: {len(lines)} log lines, {len(failures)} failure block(s), {len(matches)} matching line(s)")
          PY

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morsecode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            ci-logs/**
          if-no-files-found: ignore
          retention-days: 14

      # Downloadable so gradlew, gradlew.bat and the wrapper jar can be
      # committed to the repository and CI re-verified against them.
      - name: Upload the generated Gradle wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          retention-days: 30
