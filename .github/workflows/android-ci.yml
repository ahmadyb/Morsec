name: Android CI

# The Android toolchain cannot be installed in every checkout of this repository,
# so compilation, KSP/Hilt processing, lint, unit tests and APK assembly are
# proven here instead. The Node scripts under tools/verify check design-token
# fidelity only; they are not a substitute for this workflow.
#
# Failure text is republished as check-run annotations on purpose: the Actions
# log blob hosts are not reachable from every environment, while the annotations
# API is, so a failed run can be diagnosed without downloading logs.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - arena/01a0e98a-morsec

permissions:
  # contents: write is needed by the last step, which commits the Gradle wrapper
  # this workflow generates: the jar is a binary artifact that cannot be produced
  # in a checkout without the Android toolchain, and Actions artifact downloads
  # are not reachable from every environment.
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, lint, assemble (JDK 17 · API 36 · minSdk 23)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; only the packages this project needs
      # are installed explicitly so the build never depends on image drift.
      - name: Install Android SDK Platform 36 and build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            ls -R "$SDK" | head -50
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Record the build environment
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          {
            echo "== date/uname =="; date -u; uname -a
            echo "== java =="; java -version 2>&1; echo "JAVA_HOME=$JAVA_HOME"
            echo "== PATH =="; echo "$PATH" | tr ':' '\n'
            echo "== android =="; echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1 || true
            ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>&1 || true
            echo "== which =="; for c in gradle sdkmanager java javac python3 unzip curl; do printf '%s: ' "$c"; command -v "$c" || echo MISSING; done
            echo "== local.properties =="; cat local.properties 2>&1 || true
          } 2>&1 | tee ci-logs/00-environment.log

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      # gradle/wrapper/gradle-wrapper.jar is a binary artifact and is not in the
      # repository yet, so the wrapper is generated here and uploaded below.
      - name: Generate the Gradle wrapper
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          {
            if ! command -v gradle > /dev/null 2>&1; then
              echo "gradle is not on PATH; installing the 8.13 distribution directly"
              curl -fsSL -o /tmp/gradle-8.13-bin.zip \
                https://services.gradle.org/distributions/gradle-8.13-bin.zip
              unzip -q /tmp/gradle-8.13-bin.zip -d /opt
              export PATH="/opt/gradle-8.13/bin:$PATH"
              echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"
            fi
            echo "gradle: $(command -v gradle)"
            gradle --version
            if [ -s gradlew ] && [ -s gradle/wrapper/gradle-wrapper.jar ] \
              && git ls-files --error-unmatch gradlew > /dev/null 2>&1; then
              echo "the wrapper is committed already; verifying it instead of regenerating"
            else
              gradle wrapper --gradle-version 8.13 --distribution-type bin
            fi
            chmod +x gradlew
            test -s gradle/wrapper/gradle-wrapper.jar || echo "::error::wrapper jar was not generated"
            test -s gradlew.bat || echo "::error::gradlew.bat was not generated"
            ls -la gradlew gradlew.bat gradle/wrapper/
            ./gradlew --version
          } 2>&1 | tee ci-logs/05-wrapper.log

      - name: Milestone hygiene (no TODO/stub markers in delivered sources)
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace checkMilestoneHygiene 2>&1 | tee ci-logs/10-hygiene.log

      - name: JVM unit tests
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --continue test 2>&1 | tee ci-logs/20-unit-tests.log

      - name: Android lint
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace --continue \
            :app:lintDebug \
            :core-design:lintDebug \
            :core-data:lintDebug \
            :core-storage:lintDebug \
            :transport-lan:lintDebug \
            :transport-nearby:lintDebug \
            :media:lintDebug 2>&1 | tee ci-logs/30-lint.log

      - name: Assemble the debug APK
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ci-logs/40-assemble.log

      # The instrumentation runner lives in src/androidTest, which the tasks above
      # never compile, so the androidTest APK is assembled explicitly.
      - name: Assemble the instrumentation APK
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest 2>&1 | tee ci-logs/45-android-test.log

      - name: Summarise test and lint results
        if: always()
        env:
          SUMMARY_PATH: ${{ github.step_summary }}
        run: |
          python3 - <<'PY'
          import os, glob, xml.etree.ElementTree as ET

          lines = ["## Test results", ""]
          total = failed = skipped = 0
          files = sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True))
          for path in files:
              module = path.split("/build/")[0]
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  lines.append(f"- `{module}` — {os.path.basename(path)}: unparseable report")
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  t = int(suite.get("tests", 0))
                  f = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s = int(suite.get("skipped", 0))
                  total += t; failed += f; skipped += s
                  lines.append(f"- `{module}` — {suite.get('name', '?')}: {t} tests, {f} failed, {s} skipped")
          failing = []
          for path in files:
              module = path.split("/build/")[0]
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for suite in ([root] if root.tag == "testsuite" else root.findall("testsuite")):
                  for case in suite.findall("testcase"):
                      for kind in ("failure", "error"):
                          node = case.find(kind)
                          if node is None:
                              continue
                          detail = (node.get("message") or node.text or "").strip()
                          detail = " ⏎ ".join(l.strip() for l in detail.splitlines() if l.strip())[:900]
                          failing.append(f"{module} {case.get('classname')}#{case.get('name')}: {detail}")
          for entry in failing[:40]:
              text = entry.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=failing test::{text}")

          if not files:
              lines.append("No unit-test reports were produced.")
          lines += ["", f"**Total: {total} tests, {failed} failed, {skipped} skipped**", ""]
          if failing:
              lines += ["### Failing tests", ""]
              lines += [f"- `{entry}`" for entry in failing[:40]]
              lines.append("")
          lines += ["## Lint", ""]
          reports = sorted(set(glob.glob("**/build/reports/lint-results-debug.*", recursive=True)))
          lint_issues = 0
          for path in reports:
              if path.endswith(".xml"):
                  try:
                      issues = ET.parse(path).getroot().findall("issue")
                      lint_issues += len(issues)
                      lines.append(f"- `{path.split('/build/')[0]}`: {len(issues)} issue(s)")
                  except ET.ParseError:
                      lines.append(f"- `{path}`: unparseable report")
              else:
                  lines.append(f"- `{path}`")
          if not reports:
              lines.append("No lint reports were produced.")
          else:
              lines += ["", f"**Total lint issues: {lint_issues}**"]
          apks = sorted(glob.glob("app/build/outputs/apk/debug/*.apk"))
          lines += ["", "## APK", ""]
          lines += [f"- `{a}`: {os.path.getsize(a) / 1048576:.2f} MiB" for a in apks] or ["No APK produced."]

          with open(os.environ["SUMMARY_PATH"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      # Lint runs with abortOnError = true, so a red build is the only signal
      # that survives in the log tail — which prints a single "first failure".
      # Every finding is therefore republished from the XML reports (xmlReport is
      # enabled in each module's lint block), packed into as few annotations as
      # the per-step cap allows.
      - name: Publish lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          CHUNK = 12000

          def command(level, title, message):
              # Workflow-command escaping: %, \r and \n are special in ::commands::.
              text = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              title = title.replace("%", "%25").replace("\r", " ").replace("\n", " ")
              return f"::{level} title={title}::{text}"

          def emit(level, title, entries):
              sent, chunk, index = 0, [], 1
              for entry in entries:
                  if chunk and sum(len(x) + 3 for x in chunk) + len(entry) > CHUNK:
                      print(command(level, f"{title} part {index}", " ⏎ ".join(chunk)))
                      sent, chunk, index = sent + 1, [], index + 1
                  chunk.append(entry)
              if chunk:
                  print(command(level, f"{title} part {index}", " ⏎ ".join(chunk)))
                  sent += 1
              return sent

          reports = sorted(set(glob.glob("**/build/reports/lint-results-*.xml", recursive=True)))
          if not reports:
              print("::error title=lint::no lint XML report was produced")
          errors, warnings = [], {}
          for path in reports:
              try:
                  issues = ET.parse(path).getroot().findall("issue")
              except ET.ParseError:
                  print(command("error", "lint", f"{path} could not be parsed"))
                  continue
              for issue in issues:
                  iid = issue.get("id", "?")
                  severity = (issue.get("severity") or "").lower()
                  message = " ".join((issue.get("message") or "").split())
                  location = issue.find("location")
                  where = ""
                  if location is not None and location.get("file"):
                      where = os.path.relpath(location.get("file"))
                      if location.get("line"):
                          where += f":{location.get('line')}"
                  entry = f"{where or path.split('/build/')[0]} [{iid}] {message}"
                  if severity in ("fatal", "error"):
                      errors.append(entry)
                  else:
                      warnings.setdefault(iid, []).append(entry)

          total_warnings = sum(len(found) for found in warnings.values())
          if errors:
              emit("error", f"lint errors: {len(errors)}", errors)
          if warnings:
              histogram = [
                  f"{iid}: {len(found)} — first at {found[0]}"
                  for iid, found in sorted(warnings.items(), key=lambda kv: -len(kv[1]))
              ]
              emit("warning", f"lint warnings: {total_warnings}", histogram)
          print(f"lint reports: {len(reports)}; errors: {len(errors)}; warnings: {total_warnings}")
          PY

      # Publishes the interesting lines of every captured Gradle log as check-run
      # annotations. GitHub caps the number of annotations, so related lines are
      # packed into as few (long) messages as possible instead of one per line.
      - name: Publish failure annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re

          CHUNK = 13000
          BUCKETS = [
              ("kotlin", re.compile(r"^e: ")),
              ("kotlin-warning", re.compile(r"^w: ")),
              ("resources", re.compile(r"(AAPT|aapt2|error: resource|failed linking|Resource compilation)", re.I)),
              ("lint", re.compile(r"(Lint found|Error:.*\[|lint-results|errors?, \d+ warnings)", re.I)),
              ("ksp", re.compile(r"(\[ksp\]|KSP|dagger|Hilt|Room)", re.I)),
              ("gradle", re.compile(
                  r"(FAILURE:|What went wrong|Where:|Execution failed for task|^> Task .* FAILED|"
                  r"Caused by:|Could not resolve|GradleException|"
                  r"Script compilation error|error:|Exception is:)", re.I)),
          ]

          def command(level, title, message):
              # Workflow-command escaping: %, \r and \n are special in ::commands::.
              text = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              title = title.replace("%", "%25").replace("\r", " ").replace("\n", " ")
              return f"::{level} title={title}::{text}"

          def emit(name, bucket, lines):
              if not lines:
                  return 0
              sent = 0
              chunk, index = [], 1
              for line in lines:
                  if sum(len(x) + 3 for x in chunk) + len(line) > CHUNK and chunk:
                      print(command("error", f"{name} — {bucket} ({index})", " ⏎ ".join(chunk)))
                      sent += 1
                      chunk, index = [], index + 1
                  chunk.append(line)
              if chunk:
                  print(command("error", f"{name} — {bucket} ({index})", " ⏎ ".join(chunk)))
                  sent += 1
              return sent

          logs = sorted(glob.glob("ci-logs/*.log"))
          if not logs:
              print("::error title=ci::no Gradle logs were captured")
          for path in logs:
              name = os.path.basename(path)
              with open(path, encoding="utf-8", errors="replace") as handle:
                  raw = handle.read().splitlines()
              counts = []
              for bucket, pattern in BUCKETS:
                  seen, kept = set(), []
                  for i, line in enumerate(raw):
                      stripped = line.strip()
                      if not stripped or not pattern.search(stripped):
                          continue
                      key = stripped[:250]
                      if key in seen:
                          continue
                      seen.add(key)
                      kept.append(f"L{i + 1}: {stripped[:700]}")
                  if kept:
                      emit(name, bucket, kept[:400])
                      counts.append(f"{bucket}={len(kept)}")
              failures = [i for i, l in enumerate(raw)
                          if l.startswith("FAILURE:") or re.match(r"^\d+: Task failed with an exception", l)]
              for start in failures[:8]:
                  block = [l for l in raw[start:start + 200] if l.strip() and not l.strip().startswith("at org.gradle")]
                  emit(name, "what went wrong", [" ⏎ ".join(block)[:CHUNK]])
              tail = [l for l in raw[-30:] if l.strip()]
              if tail:
                  emit(name, "tail", [" ⏎ ".join(tail)[:CHUNK]])
              print(f"{name}: {len(raw)} lines; {' '.join(counts) or 'no matching lines'}")
          PY

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morsecode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            ci-logs/**
          if-no-files-found: ignore
          retention-days: 14

      # Downloadable so gradlew, gradlew.bat and the wrapper jar can be
      # committed to the repository and CI re-verified against them.
      - name: Upload the generated Gradle wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          retention-days: 30

      # The artifact above cannot be downloaded in every environment (the blob
      # hosts are blocked in some sandboxes), so the wrapper is committed back to
      # the branch here. Pushes made with GITHUB_TOKEN never start another
      # workflow run, so this cannot loop, and the step above starts verifying
      # the committed wrapper from the next run onwards.
      - name: Commit the generated Gradle wrapper
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0e98a-morsec' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          if git ls-files --error-unmatch gradlew > /dev/null 2>&1; then
            echo "gradlew is already tracked; nothing to commit."
            exit 0
          fi
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar \
                   gradle/wrapper/gradle-wrapper.properties; do
            test -s "$f" || { echo "::error::generated wrapper file is missing: $f"; exit 1; }
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "$BRANCH"
          # Rebased on the current tip so a fix pushed while this run was in
          # flight is not overwritten.
          git checkout -B wrapper-commit "origin/$BRANCH"
          git add gradlew gradlew.bat \
                  gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "Commit the Gradle 8.13 wrapper generated in CI

          gradle-wrapper.jar is a binary artifact and no checkout of this
          repository has the Android toolchain to produce it, so CI generates the
          wrapper once and commits it back. Every later run verifies the
          committed wrapper instead of regenerating it."
          if ! git push origin "HEAD:$BRANCH"; then
            echo "push rejected; rebasing on the new tip and retrying"
            git fetch --quiet origin "$BRANCH"
            git rebase "origin/$BRANCH" || { echo "::error::wrapper commit does not rebase cleanly"; exit 1; }
            git push origin "HEAD:$BRANCH"
          fi
          git --no-pager log --oneline -3
